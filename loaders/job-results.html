<!-- Shazamme job-results widget — paste into the Duda widget's JavaScript tab.
     Pinned to release TAG v0.1.1 (immutable — jsDelivr resolves tags instantly,
     unlike @main which caches its branch->commit resolution for up to 12h).
     To roll forward/back, bump TAG to another release. VER = dist folder version. -->
<script>
(function () {
  var NAME = "job-results";
  var TAG  = "v0.1.1";
  var VER  = "0.1.0";
  var SRC  = "https://cdn.jsdelivr.net/gh/Shazamme-IO/shazamme-widgets@" +
             TAG + "/dist/" + NAME + "/" + VER + "/widget.min.js";

  function run() {
    var controller = window.ShazammeWidget && window.ShazammeWidget[NAME];
    if (typeof controller === "function") {
      controller({ element: element, data: data, $: $, shazamme: shazamme });
    }
  }

  if (window.ShazammeWidget && window.ShazammeWidget[NAME]) {
    run();
  } else {
    var s = document.createElement("script");
    s.src = SRC;
    s.onload = run;
    document.head.appendChild(s);
  }
})();
</script>
