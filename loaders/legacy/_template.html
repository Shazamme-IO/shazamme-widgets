<!-- Shazamme LEGACY-PORT widget loader — UNIVERSAL STUB (template).
     PASTE ONLY THE INNER JAVASCRIPT (everything between the <script> tags) into
     the Duda widget's JavaScript tab. Do NOT paste the <script>/</script> lines —
     Duda wraps the tab in function(element,data,api){...}; a literal <script> is a
     syntax error that kills the whole widget.

     This stub OWNS the single SDK load (window.__shazSDKPromise) and works for ANY
     ported widget — copy it, set NAME to the widget's registered name, done. The
     ported bundle registers window.ShazammeWidget[NAME] and reuses the same
     __shazSDKPromise, so the SDK is fetched at most once per page.
     Set NAME below (e.g. "login-dialog" | "job-app-sq-sr"). -->
<script>
(function () {
  var NAME = "<name>";
  var BUNDLE = "https://sdk.shazamme.io/js/widget/" + NAME + "/widget.min.js";
  var SDK = "https://sdk.shazamme.io/js/shazamme-1.0.3.min.js";
  window.__shazSDKPromise = window.__shazSDKPromise || new Promise(function (res) {
    if (window.shazamme) return res();
    var s = document.createElement("script"); s.src = SDK; s.onload = res; document.head.appendChild(s);
  });
  function bundle() { return new Promise(function (res) {
    if (window.ShazammeWidget && window.ShazammeWidget[NAME]) return res();
    var s = document.createElement("script"); s.src = BUNDLE; s.onload = res; document.head.appendChild(s);
  }); }
  Promise.all([window.__shazSDKPromise, bundle()]).then(function () {
    window.ShazammeWidget[NAME]({ element: element, data: data, $: window.jQuery || window.$, shazamme: window.shazamme });
  });
})();
</script>
