<!--
  job-search widget template — paste into the Duda widget HTML tab.
  Cleaned + collapsed from jobsearch2026 + jobsearch2026prox: no Google Places
  nodes, no Fuse.js, no .gapi-map. The location field's suggestions are populated
  by the controller via geocode.maps.co (core/geo). The controller (index.ts)
  queries the data-rel / data-filter hooks below, populates each <select> from the
  job model, and shows or hides field blocks from the widget config — the markup
  is static so it renders identically inside and outside the Duda editor.
-->
<link rel="preconnect" href="https://sdk.shazamme.io" crossorigin>

<div class="job-search-root">
  <div class="mainSearchContainer" data-rel="search-form">
    <!-- keyword -->
    <div class="flex-items-js" data-rel="field-keyword" hidden>
      <input class="shzmSearch jobSearch" type="text" autocomplete="off" data-rel="search-keyword" placeholder="Search jobs" />
    </div>

    <!-- job type -->
    <div class="flex-items-js" data-rel="field-jobType" hidden>
      <select data-filter="jobTypeID"><option value="">All Job Types</option></select>
    </div>

    <!-- classification / profession (multi-select) -->
    <div class="flex-items-js multi-select-wrapper" data-rel="field-classification" data-ms-field="professionID" hidden>
      <div class="multi-select-box" data-rel="ms-box">
        <span class="multi-select-placeholder">All Classifications</span>
        <span class="multi-select-arrow">&#9660;</span>
      </div>
      <div class="multi-select-tags" data-rel="ms-tags"></div>
      <div class="multi-select-dropdown" data-rel="ms-dropdown"></div>
    </div>

    <!-- sub-classification / role (multi-select, depends on classification) -->
    <div class="flex-items-js multi-select-wrapper" data-rel="field-subClassification" data-ms-field="roleID" hidden>
      <div class="multi-select-box" data-rel="ms-box">
        <span class="multi-select-placeholder">All Sub Classifications</span>
        <span class="multi-select-arrow">&#9660;</span>
      </div>
      <div class="multi-select-tags" data-rel="ms-tags"></div>
      <div class="multi-select-dropdown" data-rel="ms-dropdown"></div>
    </div>

    <!-- work type -->
    <div class="flex-items-js" data-rel="field-workType" hidden>
      <select data-filter="workTypeID"><option value="">All Work Types</option></select>
    </div>

    <!-- work model -->
    <div class="flex-items-js" data-rel="field-workModel" hidden>
      <select data-filter="workModelID"><option value="">All Work Models</option></select>
    </div>

    <!-- location / state (multi-select) -->
    <div class="flex-items-js multi-select-wrapper" data-rel="field-location" data-ms-field="state" hidden>
      <div class="multi-select-box" data-rel="ms-box">
        <span class="multi-select-placeholder">All Locations</span>
        <span class="multi-select-arrow">&#9660;</span>
      </div>
      <div class="multi-select-tags" data-rel="ms-tags"></div>
      <div class="multi-select-dropdown" data-rel="ms-dropdown"></div>
    </div>

    <!-- proximity / geocode (shown when showGeoSearch + geocodeApiKey) -->
    <div class="flex-items-js" data-rel="field-geo" hidden>
      <div class="split">
        <input class="shzmSearch geoSearch" type="text" autocomplete="off" data-rel="geo-input" placeholder="City, state or postcode" />
        <div class="prediction-result" data-rel="geo-prediction"></div>
      </div>
      <div class="geo-range">
        <input type="range" class="field" value="50" min="5" max="200" data-rel="geo-range" />
        <label class="text" data-rel="geo-range-display">50 mi</label>
      </div>
    </div>

    <!-- submit -->
    <div class="flex-items-js jsBtnWrap">
      <button class="searchBtn" data-rel="search-button"><span class="text">Search</span> <span class="count" data-rel="results-count"></span></button>
    </div>
  </div>
</div>
