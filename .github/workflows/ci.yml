# The URL-slash guard was deleted three times by GitHub web-UI edits, which never run
# anything locally. Guards only guard if CI runs them on every push and PR.
name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
